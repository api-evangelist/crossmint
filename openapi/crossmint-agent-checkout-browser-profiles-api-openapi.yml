components:
  schemas:
    UpdateAgentCheckoutBrowserProfileDTO:
      properties:
        label:
          maxLength: 120
          minLength: 1
          type: string
      required:
      - label
      type: object
    AgentCheckoutBrowserProfileResponseDTO:
      properties:
        createdAt:
          minLength: 1
          type: string
        id:
          allOf:
          - pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          - pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        label:
          maxLength: 120
          minLength: 1
          type: string
        updatedAt:
          minLength: 1
          type: string
      required:
      - createdAt
      - id
      - updatedAt
      type: object
    CreateAgentCheckoutBrowserProfileDTO:
      properties:
        label:
          maxLength: 120
          minLength: 1
          type: string
      type: object
    AgentCheckoutBrowserProfileListResponseDTO:
      properties:
        data:
          items:
            properties:
              createdAt:
                minLength: 1
                type: string
              id:
                allOf:
                - pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                - pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                type: string
              label:
                maxLength: 120
                minLength: 1
                type: string
              updatedAt:
                minLength: 1
                type: string
            required:
            - createdAt
            - id
            - updatedAt
            type: object
          type: array
        nextCursor:
          anyOf:
          - minLength: 1
            type: string
          - type: 'null'
      required:
      - data
      - nextCursor
      type: object
    ApiErrorDto:
      properties:
        code:
          description: Machine-readable error code for programmatic handling
          type: string
        error:
          example: true
          type: boolean
        message:
          description: Human-readable error message describing what went wrong
          type: string
        parameters:
          additionalProperties:
            oneOf:
            - items:
                type: string
              type: array
            - type: string
          description: Values that explain a coded error, such as the limit that was exceeded, the amount that remains, or the list of supported currencies.
          type: object
      required:
      - error
      - message
      type: object
  securitySchemes:
    apiKey:
      description: API key required for authentication
      in: header
      name: X-API-KEY
      type: apiKey
    orderClientSecret:
      description: The `clientSecret` returned when the order was created, sent as the raw `Authorization` header value. Lets a browser or mobile client read and continue its own order without a server-side API key.
      in: header
      name: Authorization
      type: apiKey
    userJwt:
      bearerFormat: JWT
      description: 'The end user''s JWT, sent as `Authorization: Bearer <JWT>` together with a client-side API key. Validated against the project''s external JWT configuration.'
      scheme: bearer
      type: http
