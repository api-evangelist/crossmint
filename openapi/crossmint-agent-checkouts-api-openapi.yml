  /unstable/agent-checkouts/{id}:
    get:
      description: 'Returns one checkout run by ID. Read `status` to see where it is: `queued`, `running`, `awaiting_input` when the agent needs an answer from the user, then `succeeded`, `failed`, `cancelled`, or `blocked`. `requiredAction` describes what an `awaiting_input` run is waiting for.


        **API scope required**: `agent-checkouts.read`'
      operationId: agentCheckouts.get
      parameters:
      - description: Server-side subject to act on behalf of. Ignored for client-side user auth.
        in: header
        name: x-crossmint-user-id
