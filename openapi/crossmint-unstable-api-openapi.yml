    WalletsV1Alpha2TransactionRevert:
      properties:
        debug:
          description: Structured debugging information for the revert
          examples:
          - blockNumber: '38104211'
            call:
              args:
              - name: to
                type: address
                value: '0x9999999999999999999999999999999999999999'
              - name: amount
                type: uint256
                value: '1000000'
              function: transfer(address,uint256)
              index: 1
              to: '0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
              value: '0'
            chain: base
            details:
              available: '500000'
              code: insufficient_erc20_balance
              required: '1000000'
              symbol: USDC
              token: '0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
            message: Wallet holds 0.5 USDC but the transfer requires 1 USDC
            retryable: true
            revert:
              args:
              - type: address
                value: '0x1234567890abcdef1234567890abcdef1234abcd'
              - type: uint256
                value: '500000'
              - type: uint256
                value: '1000000'
              name: ERC20InsufficientBalance
              selector: '0xe450d38c'
              signature: ERC20InsufficientBalance(address,uint256,uint256)
          properties:
            blockNumber:
              description: Block the failure was observed at; replay with eth_call / debug_traceCall
              pattern: ^\d+$
              type: string
            call:
              description: The call in the batch that reverted; absent when the failure cannot be attributed to a call
              properties:
                args:
                  items:
                    properties:
                      name:
                        description: Parameter name; only set when the ABI came from the request
                        type: string
                      type:
                        description: Solidity type, e.g. `address` or `uint256`
                        type: string
                      value:
                        description: Decoded value; bigints as decimal strings
                        type: string
                    required:
                    - type
                    - value
                    type: object
                  type: array
                function:
                  description: Function signature, e.g. `transfer(address,uint256)`
                  type: string
                index:
                  description: Index of the call within the transaction's batch
                  maximum: 9007199254740991
                  minimum: -9007199254740991
                  type: integer
                to:
                  description: An EVM address string
                  type: string
                value:
                  description: Native value sent with the call, in wei
                  pattern: ^\d+$
                  type: string
              required:
              - args
              - index
              - to
              - value
              type: object
            chain:
              type: string
            details:
              description: 'Classified root cause. Branch on `code`: `insufficient_*` and `out_of_gas` are fixable by the caller, `account_abstraction` is an EntryPoint rejection (see `entryPointCode`), `contract_revert` is a decoded revert with no further classification (see `revert`), `unknown` means no revert data was available'
              oneOf:
              - properties:
                  available:
                    description: Unsigned integer encoded as a decimal string
                    pattern: ^\d+$
                    type: string
                  code:
                    const: insufficient_erc20_allowance
                    type: string
                  required:
                    description: Unsigned integer encoded as a decimal string
                    pattern: ^\d+$
                    type: string
                  spender:
                    description: Address that needs the approval
                    type: string
                  symbol:
                    type: string
                  token:
                    description: An EVM address string
                    type: string
                required:
                - available
                - code
                - required
                - spender
                - token
                type: object
              - properties:
                  available:
                    description: Unsigned integer encoded as a decimal string
                    pattern: ^\d+$
                    type: string
                  code:
                    const: insufficient_erc20_balance
                    type: string
                  required:
                    description: Unsigned integer encoded as a decimal string
                    pattern: ^\d+$
                    type: string
                  symbol:
                    type: string
                  token:
                    description: An EVM address string
                    type: string
                required:
                - available
                - code
                - required
                - token
                type: object
              - properties:
                  available:
                    description: Unsigned integer encoded as a decimal string
                    pattern: ^\d+$
                    type: string
                  code:
                    const: insufficient_native_balance
                    type: string
                  required:
                    description: Wei needed to cover value plus gas
                    pattern: ^\d+$
                    type: string
                required:
                - available
                - code
                - required
                type: object
              - properties:
                  code:
                    const: account_abstraction
                    type: string
                  entryPointCode:
                    description: ERC-4337 EntryPoint code, e.g. `AA21`
                    type: string
                  entryPointMessage:
                    description: EntryPoint's own message, e.g. `didn't pay prefund`
                    type: string
                required:
                - code
                - entryPointCode
                - entryPointMessage
                type: object
              - properties:
                  code:
                    const: contract_revert
                    type: string
                required:
                - code
                type: object
              - properties:
                  code:
                    const: out_of_gas
                    type: string
                  gasLimit:
                    description: Unsigned integer encoded as a decimal string
                    pattern: ^\d+$
                    type: string
                  gasUsed:
                    description: Unsigned integer encoded as a decimal string
                    pattern: ^\d+$
                    type: string
                required:
                - code
                - gasLimit
                type: object
              - properties:
                  code:
                    const: unknown
                    type: string
                required:
                - code
                type: object
            message:
              description: Human-readable summary of `details`
              type: string
            retryable:
              description: True when the same transaction can succeed after the caller fixes state (funds, allowance, gas)
              type: boolean
            revert:
              description: Raw revert as returned by the chain, decoded when the error is known
              properties:
                args:
                  description: Positional decoded error arguments; empty when undecoded
                  items:
                    properties:
                      name:
                        description: Parameter name; only set when the ABI came from the request
                        type: string
                      type:
                        description: Solidity type, e.g. `address` or `uint256`
                        type: string
                      value:
                        description: Decoded value; bigints as decimal strings
                        type: string
                    required:
                    - type
                    - value
                    type: object
                  type: array
                name:
                  type: string
                selector:
                  description: 4-byte error selector; absent when the revert carried no data
                  pattern: ^0x[0-9a-fA-F]{8}$
                  type: string
                signature:
                  type: string
              required:
              - args
              type: object
          required:
          - blockNumber
          - chain
          - details
          - message
          - retryable
          - revert
          type: object
