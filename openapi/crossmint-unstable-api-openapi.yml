openapi: 3.2.0
info:
  contact:
    email: support@crossmint.com
    name: Crossmint Support
    url: https://www.crossmint.com
  description: Generated from Crossmint's published product API specifications. Do not edit by hand.
  title: Crossmint Unstable API
  version: 1.0.0
servers:
- description: Staging environment (testnets)
  url: https://staging.crossmint.com/api
- description: Production environment (mainnets)
  url: https://www.crossmint.com/api
tags:
- name: Unstable
paths:
  /unstable/wallets/me{walletLocator}/transfers:
    get:
      description: 'Retrieves activity history for the authenticated user''s wallet including transactions and other relevant events. This is an unstable API that may change without notice.


        **API scope required**: `wallets.read`'
      operationId: wallets.unstable.me.activity.list
      parameters:
      - in: path
        name: walletLocator
        required: true
        schema:
          type: string
      - description: Opaque cursor from a previous response (`nextCursor` or `previousCursor`). Omit it on the first request.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Maximum number of results per page. Minimum 1, maximum 100. Default 30.
        in: query
        name: limit
        required: false
        schema:
          type: string
      - description: Sort direction by creation date. `desc` returns the newest first (default). `asc` returns the oldest first.
        in: query
        name: sort
        required: false
        schema:
          default: desc
          enum:
          - asc
          - desc
          type: string
      - description: The blockchain network to query. Either an EVM chain, Solana, or Stellar.
        in: query
        name: chain
        required: true
        schema:
          enum:
          - abstract
          - abstract-testnet
          - apechain
          - arbitrum
          - arbitrum-sepolia
          - arbitrumnova
          - arc
          - arc-testnet
          - astar-zkevm
          - avalanche
          - avalanche-fuji
          - base
          - base-goerli
          - base-sepolia
          - bsc
          - bsc-testnet
          - celo
          - celo-sepolia
          - chiliz
          - chiliz-spicy-testnet
          - coti
          - coti-testnet
          - curtis
          - ethereum
          - ethereum-goerli
          - ethereum-sepolia
          - flow
          - flow-testnet
          - hedera
          - hedera-testnet
          - hypersonic-testnet
          - lightlink
          - lightlink-pegasus
          - mantle
          - mantle-sepolia
          - mode
          - mode-sepolia
          - optimism
          - optimism-goerli
          - optimism-sepolia
          - plume
          - plume-testnet
          - polygon
          - polygon-amoy
          - polygon-mumbai
          - rari
          - rari-testnet
          - robinhood-chain
          - robinhood-chain-testnet
          - scroll
          - scroll-sepolia
          - sei-atlantic-2-testnet
          - sei-pacific-1
          - shape
          - shape-sepolia
          - skale-nebula
          - skale-nebula-testnet
          - solana
          - soneium
          - soneium-minato-testnet
          - space
          - space-testnet
          - stellar
          - story
          - story-testnet
          - tempo
          - tempo-testnet
          - u2u-nebulas
          - u2u-solaris
          - verify-testnet
          - viction
          - viction-testnet
          - world-chain
          - world-chain-sepolia
          - xai
          - xai-sepolia-testnet
          - zenchain-testnet
          - zkatana
          - zkyoto
          - zora
          - zora-goerli
          - zora-sepolia
          examples:
          - ethereum
          type: string
      - description: The tokens to query. Comma-separated list of either tokens or token locator strings
        in: query
        name: tokens
        required: true
        schema:
          type: string
      - description: The status of the transfers to query
        in: query
        name: status
        required: true
        schema:
          enum:
          - failed
          - successful
          examples:
          - successful
          type: string
      - description: Filter transfers from this date (inclusive). ISO 8601 format. Supported for EVM and Stellar chains.
        in: query
        name: fromDate
        required: false
        schema:
          description: ISO 8601 in UTC. Fractional seconds are optional.
          example: 2024-01-15 10:30:00+00:00
          examples:
          - 2024-01-01 00:00:00+00:00
          format: date-time
          type: string
      - description: Filter transfers until this date (inclusive). ISO 8601 format. Supported for EVM and Stellar chains.
        in: query
        name: toDate
        required: false
        schema:
          description: ISO 8601 in UTC. Fractional seconds are optional.
          example: 2024-01-15 10:30:00+00:00
          examples:
          - 2024-12-31 23:59:59+00:00
          format: date-time
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletsActivityResponseUnstableDTO'
          description: The wallet activity has been successfully retrieved.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletV1Alpha2ErrorDTO'
          description: Returns an error if a wallet with the specified type not found for the authenticated user
      security:
      - apiKey: []
        userJwt: []
      summary: Get Wallet Activity For Authenticated User (Unstable)
      tags:
      - Unstable
  /unstable/wallets/me{walletType}/tokens/{tokenLocator}/transfers:
    post:
      description: Sends a token of any type from the authenticated user's wallet to a recipient
      operationId: wallets.unstable.me.transfers.create
      parameters:
      - in: path
        name: walletType
        required: true
        schema:
          type: string
      - description: 'A token locator that supports native tokens, fungible tokens, and NFTs across different chains. It can be of the format:

          - `chain:address[:tokenId]`

          - `chain:currency`

          - `chain:address`'
        in: path
        name: tokenLocator
        required: true
        schema:
          type: string
      - description: Unique key to prevent duplicate transaction creation
        in: header
        name: x-idempotency-key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTokenDTO'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletsV1Alpha2TransactionResponseDTOClass'
          description: The transaction has been successfully created.
      security:
      - apiKey: []
        userJwt: []
      summary: Transfer Token For Authenticated User
      tags:
      - Unstable
  /unstable/wallets/{walletLocator}/balances:
    get:
      description: 'Get the balance of a wallet for a given chain and currency


        **API scope required**: `wallets:balance.read`'
      operationId: wallets.unstable.balances.get
      parameters:
      - description: 'A wallet locator can be of the format:

          - `<walletAddress>`

          - `email:<email>:<chainType>[:<walletType>][:alias:<alias>]` (walletType defaults to ''smart'')

          - `userId:<userId>:<chainType>[:<walletType>][:alias:<alias>]` (white label user example)

          - `phoneNumber:<phoneNumber>:<chainType>[:<walletType>][:alias:<alias>]`

          - `twitter:<handle>:<chainType>[:<walletType>][:alias:<alias>]`

          - `x:<handle>:<chainType>[:<walletType>][:alias:<alias>]`

          - `me:<chainType>[:<walletType>][:alias:<alias>]` (Use when calling from the client side with a client API key)

          - `chainType[:<walletType>]:alias:<alias>`'
        in: path
        name: walletLocator
        required: true
        schema:
          type: string
      - description: The blockchain(s) to query. Comma-separated list of chains
        in: query
        name: chains
        required: false
        schema:
          type: string
      - description: The tokens to query. Comma-separated list of either tokens or token locator strings
        in: query
        name: tokens
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalanceUnstableResponseDTO'
          description: Returns the balance of the wallet for the given chain and currency
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletV1Alpha2ErrorDTO'
          description: Returns an error (400) if the wallet locator is invalid or if the address type is not supported
      security:
      - apiKey: []
      summary: Get Wallet Balance
      tags:
      - Unstable
  /unstable/wallets/{walletLocator}/tokens/{tokenLocator}/transfers:
    post:
      description: Sends a token of any type from this wallet to a recipient
      operationId: wallets.unstable.transfers.create
      parameters:
      - description: 'A wallet locator can be of the format:

          - `<walletAddress>`

          - `email:<email>:<walletType>`

          - `userId:<userId>:<walletType>`

          - `userId:<userId>:<walletType>` (white label user example)

          - `phoneNumber:<phoneNumber>:<walletType>`

          - `twitter:<handle>:<walletType>`

          - `x:<handle>:<walletType>`

          - `me:<walletType>` (Use when calling from the client side with a client API key)'
        in: path
        name: walletLocator
        required: true
        schema:
          type: string
      - description: 'A token locator that supports native tokens, fungible tokens, and NFTs across different chains. It can be of the format:

          - `chain:address[:tokenId]`

          - `chain:currency`

          - `chain:address`'
        in: path
        name: tokenLocator
        required: true
        schema:
          type: string
      - description: Unique key to prevent duplicate transaction creation
        in: header
        name: x-idempotency-key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTokenDTO'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletsV1Alpha2TransactionResponseWithSendParamsDTOClass'
          description: The transaction has been successfully created.
      security:
      - apiKey: []
      summary: Transfer Token
      tags:
      - Unstable
