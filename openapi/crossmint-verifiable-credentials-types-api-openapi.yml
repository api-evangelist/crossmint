paths:
  /v1-alpha1/credentials/types:
    post:
      description: 'Creates a credential type: the JSON Schema that every credential issued from it must match. Send the schema to create a type, or `$id` with a public URL to import an existing one. The type gets a generated ID, `crossmint::`; templates reference it by that ID.


        **API scope required**: `credentials.create`


        **Related**: Create credential types'
      operationId: credentials.types.create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TypeDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedTypeResponseDto'
          description: The credential type with its `id` and the JSON Schema it enforces.
      security:
      - apiKey: []
      summary: Create Credential Type
      tags:
      - Verifiable Credentials Types
  /v1-alpha1/credentials/types/{typeId}:
    get:
      description: 'Returns a credential type with the JSON Schema its credentials must match.


        **API scope required**: `credentials.read`'
      operationId: credentials.types.get
      parameters:
      - description: The type's ID, `crossmint:<projectId>:<name>`.
        in: path
        name: typeId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedTypeResponseDto'
          description: The credential type with its `id` and the JSON Schema it enforces.
      security:
      - apiKey: []
      summary: Get Credential Type
      tags:
      - Verifiable Credentials Types
    put:
      description: 'Creates a credential type under a name you choose, so its ID is known in advance: `crossmint::`. Send the schema to create a type, or `$id` with a public URL to import an existing one.


        **API scope required**: `credentials.create`


        **Related**: Create credential types'
      operationId: credentials.types.createWithId
      parameters:
      - description: The name to create the type under.
        in: path
        name: typeId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TypeDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedTypeResponseDto'
          description: The credential type with its `id` and the JSON Schema it enforces.
      security:
      - apiKey: []
      summary: Create Credential Type with Name
      tags:
      - Verifiable Credentials Types
