openapi: 3.2.0
info:
  contact:
    email: support@crossmint.com
    name: Crossmint Support
    url: https://www.crossmint.com
  description: Generated from Crossmint's published product API specifications. Do not edit by hand.
  title: Crossmint Tokens API
  version: 1.0.0
servers:
- description: Staging environment (testnets)
  url: https://staging.crossmint.com/api
- description: Production environment (mainnets)
  url: https://www.crossmint.com/api
tags:
- name: Tokens
paths:
  /2024-09-26/tokens:
    get:
      description: 'Returns a paginated list of the tokens that Crossmint supports for checkout, newest first: the tokens your users can buy through Crossmint. Access to this endpoint is enabled per project; contact support to enable it.


        **API scope required**: `tokens.read`'
      operationId: tokens.v20240926.list
      parameters:
      - description: Filter tokens by blockchain. Comma-separated list of chain names, for example `solana,base`.
        in: query
        name: chains
        required: false
        schema:
          example: solana,base
          type: string
      - description: Cursor for pagination. Use the `nextCursor` or `previousCursor` value from a previous response to move between pages.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Maximum number of tokens per page. Defaults to 30. The maximum is 100.
        in: query
        name: limit
        required: false
        schema:
          example: '30'
          type: string
      - description: Filter tokens by category. Comma-separated list of token classes. Omit it to return every discoverable class (memecoin,onramp).
        in: query
        name: tokenClasses
        required: false
        schema:
          example: memecoin,onramp
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllTokensResponseDTO'
          description: Paginated list of supported tokens. `nextCursor` and `previousCursor` are present when more pages exist in that direction.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Invalid query parameters, such as an unknown chain or token class.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Access to this endpoint is not enabled for the project, or the project cannot sell fungible tokens.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Rate limit exceeded.
      security:
      - apiKey: []
      summary: Get All Tokens
      tags:
      - Tokens
  /2024-09-26/tokens/{tokenLocator}:
    get:
      description: 'Returns a token by its locator, with `available` (whether Crossmint supports it) and the payment features Crossmint offers for it.


        **API scope required**: `tokens.read` or `orders.create`'
      operationId: tokens.v20240926.get
      parameters:
      - description: Locator of the fungible token, in the format `<chain>:<tokenAddress>`. Solana and EVM chains are supported, for example `base:0xa4a2e2ca3fbfe21aed83471d28b6f65a233c6e00`.
        in: path
        name: tokenLocator
        required: true
        schema:
          example: solana:6p6xgHyF7AeE6TZkSmFsko444wqoP15icUSqi2jfGiPN
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportedTokenResponseDTO'
          description: The token and its availability.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: '`tokenLocator` is not a valid Solana or EVM fungible token locator.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: The project cannot sell fungible tokens.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Rate limit exceeded.
      security:
      - apiKey: []
      summary: Check Token Support
      tags:
      - Tokens
components:
  schemas:
    ApiErrorDto:
      properties:
        code:
          description: Machine-readable error code for programmatic handling
          type: string
        error:
          example: true
          type: boolean
        message:
          description: Human-readable error message describing what went wrong
          type: string
        parameters:
          additionalProperties:
            oneOf:
            - items:
                type: string
              type: array
            - type: string
          description: Values that explain a coded error, such as the limit that was exceeded, the amount that remains, or the list of supported currencies.
          type: object
      required:
      - error
      - message
      type: object
    GetAllTokensResponseDTO:
      properties:
        data:
          description: Supported tokens for the current page.
          items:
            description: The queried token and the features that Crossmint supports for it.
            examples:
            - available: true
              features:
                creditCardPayment: true
              token: solana:6p6xgHyF7AeE6TZkSmFsko444wqoP15icUSqi2jfGiPN
            properties:
              available:
                description: '`true` when Crossmint supports the token.'
                type: boolean
              features:
                description: The payment features that Crossmint supports for the token.
                properties:
                  creditCardPayment:
                    description: '`true` when the token can be bought with a credit card.'
                    type: boolean
                required:
                - creditCardPayment
                title: Token features
                type: object
              token:
                description: The token locator that was queried, in the format `<chain>:<tokenAddress>`.
                type: string
            required:
            - available
            - features
            - token
            title: The requested token and its availability
            type: object
          type: array
        nextCursor:
          description: Cursor to fetch the next page. Absent when there are no more results.
          type: string
        previousCursor:
          description: Cursor to fetch the previous page. Absent on the first page.
          type: string
      required:
      - data
      title: Paginated list of supported tokens
      type: object
    SupportedTokenResponseDTO:
      properties:
        available:
          description: '`true` when Crossmint supports the token.'
          type: boolean
        features:
          description: The payment features that Crossmint supports for the token.
          properties:
            creditCardPayment:
              description: '`true` when the token can be bought with a credit card.'
              type: boolean
          required:
          - creditCardPayment
          title: Token features
          type: object
        token:
          description: The token locator that was queried, in the format `<chain>:<tokenAddress>`.
          type: string
      required:
      - available
      - features
      - token
      title: The requested token and its availability
      type: object
  securitySchemes:
    apiKey:
      description: API key required for authentication
      in: header
      name: X-API-KEY
      type: apiKey
    orderClientSecret:
      description: The `clientSecret` returned when the order was created, sent as the raw `Authorization` header value. Lets a browser or mobile client read and continue its own order without a server-side API key.
      in: header
      name: Authorization
      type: apiKey
    userJwt:
      bearerFormat: JWT
      description: 'The end user''s JWT, sent as `Authorization: Bearer <JWT>` together with a client-side API key. Validated against the project''s external JWT configuration.'
      scheme: bearer
      type: http
