    delete:
      description: 'Soft-deletes a payment method and returns it. It can no longer be used for payments. A deleted bank account stays readable through retrieve, and through list with `status=deleted`, and carries the terminal status `deleted`. A deleted card is excluded and carries no status. Deleting a bank account that is already deleted returns it again.


        **API scope required**: `payment-methods.delete`'
      operationId: paymentMethods.v20260916.delete
      parameters:
      - description: UUID of the payment method.
        in: path
        name: paymentMethodId
        required: true
        schema:
          type: string
      - description: 'Identifies the target user when authenticating with a server API key. Format: `<type>:<value>` (e.g., `email:alice@example.com`, `userId:abc123`, `phoneNumber:+12125551234`, `twitter:alice`). Required for API-key authentication; ignored when authenticating with a JWT (the JWT subject is used).'
        in: query
        name: userLocator
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                BankAccountCo:
                  summary: CO Bank Account
                  value:
                    bankAccount:
                      accountHolder:
                        document:
                          suffix: '7890'
                          type: cc
                        name: Carlos Gómez
                      accountSuffix: '7890'
                      accountType: savings
                      country: CO
                      currency: cop
                      entityType: individual
                      institutionId: co-bancolombia
