paths:
  /2022-06-09/collections/{collectionId}/templates:
    get:
      description: Get all templates in a collection (paginated)
      operationId: collections.templates.list
      parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          type: string
      - in: query
        name: page
        required: true
        schema:
          type: number
      - in: query
        name: perPage
        required: true
        schema:
          type: number
      responses:
        '200':
          description: Templates retrieved successfully
      security:
      - apiKey: []
      summary: Get Templates
      tags:
      - Minting API Templates
    post:
      description: Create a new template
      operationId: collections.templates.create
      parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreationDTO'
        required: true
      responses:
        '200':
          description: Template created successfully
      security:
      - apiKey: []
      summary: Create Template
      tags:
      - Minting API Templates
  /2022-06-09/collections/{collectionId}/templates/{templateId}:
    delete:
      description: Delete an existing template
      operationId: collections.templates.delete
      parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          type: string
      - in: path
        name: templateId
        required: true
        schema:
          type: string
      responses:
