  /unstable/agent-checkouts/{id}/messages/stream:
    get:
      description: 'Server-sent events for one checkout: `message.upsert` carries a message, `run.updated` a run update, and each event''s `id` is the cursor to resume from. Resume with `last-event-id` or `after`; omit both to stream from the start.


        The checkout is read before the stream opens, so an unknown or inaccessible one returns a normal error status. A stale resume cursor, or one from another checkout, closes the stream instead: re-read the message history and reconnect from the cursor it reports.


        **API scope required**: `agent-checkouts.read`'
      operationId: agentCheckouts.messages.stream
      parameters:
      - description: Server-side subject to act on behalf of. Ignored for client-side user auth.
        in: header
        name: x-crossmint-user-id
        required: false
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          minLength: 1
          type: string
      - in: query
        name: after
        required: false
        schema:
          minLength: 1
          type: string
      - description: Resume cursor from the last delivered event. Takes precedence over `after`.
        in: header
        name: last-event-id
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                additionalProperties: true
                type: object
          description: SSE frames carry a message object for `message.upsert` or a run update object for `run.updated`. The frame's event name identifies the payload; its id is the resume cursor.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Invalid arguments. Make sure you are following the API specification.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Forbidden. Ensure the credentials are correct and the authentication source is allowed.
        '404':
