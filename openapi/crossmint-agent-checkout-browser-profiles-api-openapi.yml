      - description: 'Server-side auth only: the subject to act on behalf of, namespaced under the key''s project. Defaults to a fixed service subject when omitted. Ignored for client-side (JWT) auth, where the subject comes from the token.'
        in: header
        name: x-crossmint-user-id
        required: false
        schema:
          type: string
      - in: query
        name: cursor
        required: false
        schema:
          minLength: 1
          type: string
      - in: query
        name: limit
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCheckoutBrowserProfileListResponseDTO'
          description: Returns the user's browser profile, or an empty list.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Invalid arguments. Make sure you are following the API specification.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Forbidden. Ensure the credentials are correct and the authentication source is allowed.
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: The upstream service returned an incompatible response.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Service unavailable. Try again in a few minutes. If the issue persists, contact Crossmint support.
      security:
      - apiKey: []
        userJwt: []
      - apiKey: []
      summary: List Browser Profiles
      tags:
      - Agent Checkout Browser Profiles
    post:
      description: 'Create a subject-scoped browser profile: a durable browser identity that lets a user''s merchant login be reused across checkout runs instead of signing in on every run.


        A user has at most one browser profile, and it accumulates saved state across merchants.


        **API scope required**: `agent-checkouts.browser-profiles.create`'
      operationId: agentCheckouts.browserProfiles.create
      parameters:
      - description: 'Server-side auth only: the subject to act on behalf of, namespaced under the key''s project. Defaults to a fixed service subject when omitted. Ignored for client-side (JWT) auth, where the subject comes from the token.'
        in: header
        name: x-crossmint-user-id
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentCheckoutBrowserProfileDTO'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCheckoutBrowserProfileResponseDTO'
          description: The browser profile was created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Invalid arguments. Make sure you are following the API specification.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Forbidden. Ensure the credentials are correct and the authentication source is allowed.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: The user already has a browser profile.
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: The upstream service returned an incompatible response.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Service unavailable. Try again in a few minutes. If the issue persists, contact Crossmint support.
      security:
      - apiKey: []
        userJwt: []
      - apiKey: []
      summary: Create Browser Profile
      tags:
      - Agent Checkout Browser Profiles
  /unstable/agent-checkouts/browser-profiles/{id}:
    delete:
      description: 'Log the user out and erase their saved browser state. This is irreversible.


        It does not cancel checkouts already running with the profile: those runs continue, and erasure completes once they finish. A `503` means erasure could not be scheduled and the profile is intact — retry.


        **API scope required**: `agent-checkouts.browser-profiles.delete`'
      operationId: agentCheckouts.browserProfiles.delete
      parameters:
      - description: 'Server-side auth only: the subject to act on behalf of, namespaced under the key''s project. Defaults to a fixed service subject when omitted. Ignored for client-side (JWT) auth, where the subject comes from the token.'
        in: header
        name: x-crossmint-user-id
        required: false
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          type: string
      responses:
        '204':
          description: The browser profile was deleted and erasure of its state was scheduled.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Invalid arguments. Make sure you are following the API specification.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Forbidden. Ensure the credentials are correct and the authentication source is allowed.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: The request conflicts with the current state of the resource.
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: The upstream service returned an incompatible response.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Erasure could not be scheduled. The browser profile is unchanged — retry.
      security:
      - apiKey: []
        userJwt: []
      - apiKey: []
      summary: Delete Browser Profile
      tags:
      - Agent Checkout Browser Profiles
    get:
      description: 'Retrieve a browser profile owned by the authenticated user. The response carries metadata only: what a checkout run did with the profile is reported on that run, not here.


        A profile owned by another user returns `404`, not `403`.


        **API scope required**: `agent-checkouts.browser-profiles.read`'
      operationId: agentCheckouts.browserProfiles.get
      parameters:
      - description: 'Server-side auth only: the subject to act on behalf of, namespaced under the key''s project. Defaults to a fixed service subject when omitted. Ignored for client-side (JWT) auth, where the subject comes from the token.'
        in: header
        name: x-crossmint-user-id
        required: false
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCheckoutBrowserProfileResponseDTO'
          description: Returns the browser profile.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Invalid arguments. Make sure you are following the API specification.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Forbidden. Ensure the credentials are correct and the authentication source is allowed.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Not found.
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: The upstream service returned an incompatible response.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Service unavailable. Try again in a few minutes. If the issue persists, contact Crossmint support.
      security:
      - apiKey: []
        userJwt: []
      - apiKey: []
      summary: Get Browser Profile
      tags:
      - Agent Checkout Browser Profiles
    patch:
      description: 'Rename a browser profile. `label` is the only editable field.


        **API scope required**: `agent-checkouts.browser-profiles.update`'
      operationId: agentCheckouts.browserProfiles.update
      parameters:
      - description: 'Server-side auth only: the subject to act on behalf of, namespaced under the key''s project. Defaults to a fixed service subject when omitted. Ignored for client-side (JWT) auth, where the subject comes from the token.'
        in: header
        name: x-crossmint-user-id
        required: false
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          format: uuid
