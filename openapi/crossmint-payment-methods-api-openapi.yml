paths:
  /2026-09-16/payment-methods:
    get:
      description: 'Returns a paginated list of payment methods for a user, newest first by default. A deleted payment method is omitted; pass `status=deleted` to list the deleted bank accounts.


        **API scope required**: `payment-methods.read`'
      operationId: paymentMethods.v20260916.list
      parameters:
      - description: Opaque cursor from a previous response (`nextCursor` or `previousCursor`). Omit it on the first request.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: Maximum number of results per page. Minimum 1, maximum 100. Default 30.
        in: query
        name: limit
        required: false
        schema:
          type: string
      - description: Sort direction by creation date. `desc` returns the newest first (default). `asc` returns the oldest first.
        in: query
        name: sort
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
      - description: Filter by payment method type. Omit to return all types.
        in: query
        name: type
        required: false
        schema:
          enum:
          - bank-account-br
          - bank-account-co
          - bank-account-id
          - bank-account-mx-clabe
          - bank-account-ng
          - bank-account-ph
          - bank-account-sepa-iban
          - bank-account-th
          - bank-account-us
          - bank-account-vn
          - bre-b
          - card
          - pix
          type: string
      - description: Set to 'deleted' to list the deleted bank accounts, which the unfiltered list omits. Cards carry no status and are never returned when this is set.
        in: query
        name: status
        required: false
        schema:
          const: deleted
          type: string
      - description: Filter to payment methods that have (true) or have not (false) funded a settled offramp payout. When set to false, cards are included in results. Omit to return all payment methods regardless of payout history.
        in: query
        name: hasPayout
        required: false
        schema:
          enum:
          - 'false'
          - 'true'
          type: string
      - description: 'Identifies the target user when authenticating with a server API key. Format: `<type>:<value>` (e.g., `email:alice@example.com`, `userId:abc123`, `phoneNumber:+12125551234`, `twitter:alice`). Required for API-key authentication; ignored when authenticating with a JWT (the JWT subject is used).'
        in: query
        name: userLocator
        required: false
        schema: {}
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - card:
                    billing:
