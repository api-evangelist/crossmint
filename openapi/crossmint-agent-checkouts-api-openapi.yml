            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: The upstream service returned an incompatible response.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Service unavailable. Try again in a few minutes. If the issue persists, contact Crossmint support.
      security:
      - apiKey: []
        userJwt: []
      - apiKey: []
      summary: List Agent Checkouts
      tags:
      - Agent Checkouts
    post:
      description: 'Starts a checkout run: the agent opens `startUrl`, works toward `task` within `constraints`, and reports back through the run''s messages. A `buyerProfileId` supplies identity and shipping details; a `browserProfileId` reuses a saved merchant login. The response is the run in `queued` status. Poll Get Agent Checkout or stream its messages to follow it.


        **API scope required**: `agent-checkouts.create`'
      operationId: agentCheckouts.create
      parameters:
      - description: Server-side subject to act on behalf of. Ignored for client-side user auth.
        in: header
        name: x-crossmint-user-id
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentCheckoutDTO'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCheckoutResponseDTO'
          description: The checkout run was accepted.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Invalid arguments. Make sure you are following the API specification.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Forbidden. Ensure the credentials are correct and the authentication source is allowed.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: The request conflicts with the current state of the resource.
        '502':
          content:
            application/json:
