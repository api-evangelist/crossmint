            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Not found.
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: The upstream service returned an incompatible response.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: Service unavailable. Try again in a few minutes. If the issue persists, contact Crossmint support.
      security:
      - apiKey: []
        userJwt: []
      - apiKey: []
      summary: Stream Agent Checkout Messages
      tags:
      - Agent Checkouts
