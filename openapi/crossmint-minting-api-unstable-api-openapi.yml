paths:
  /v1-alpha1/credentials/templates:
    post:
      description: 'Creates a credential template: a collection whose NFTs carry verifiable credentials. `credentials.type` names the credential type each credential must match; `credentials.storage` and `credentials.encryption` set where credentials are stored and whether they are encrypted. Deployment is processing when this returns.


        **API scope required**: `credentials:templates.create`


        **Related**: Create credential templates'
      operationId: credentials.templates.create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionDto'
        required: true
      responses:
        '200':
          description: Template creation started. Returns the collection with its `id` and `actionId`, as Create Collection does.
      security:
      - apiKey: []
      summary: Create Credential Template
      tags:
      - Minting API Unstable
  /v1-alpha1/credentials/templates/{collectionId}/nfts/{customerFacingId}/credentials:
    get:
      description: 'Returns the verifiable credential carried by an NFT, addressed by its template and the NFT''s ID. The response has the same shape as Get Credential.


        **API scope required**: `credentials.read`


        **Related**: Retrieve credentials'
      operationId: credentials.getByNftId
      parameters:
      - description: The credential template's ID.
        in: path
        name: collectionId
        required: true
        schema:
          type: string
      - description: The NFT's ID, `<UUID>`, as returned by Issue Credential.
        in: path
        name: customerFacingId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The credential as `unencryptedCredential`, `encryptedCredential`, or both, as in Get Credential.
        '404':
          description: No NFT matches `customerFacingId` in this template.
      security:
      - apiKey: []
      summary: Get Credential by NFT ID
      tags:
      - Minting API Unstable
  /v1-alpha1/credentials/templates/{templateId}/vcs:
    post:
      description: 'Issues a verifiable credential from a template and mints the NFT that carries it to `recipient`. `credential.subject` holds the claims and must match the template''s credential type. NFT metadata defaults to the template''s. Issuance is processing when this returns; the credential is readable once the mint completes.


        **API scope required**: `credentials.create`


        **Related**: Issue credentials'
      operationId: credentials.create
      parameters:
      - description: The credential template's ID.
        in: path
        name: templateId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreationDTO'
        required: true
      responses:
        '200':
          description: Issuance started. Returns the NFT creation response with `credentialId`, the credential's ID, and `actionId` to follow the mint.
      security:
      - apiKey: []
      summary: Issue Credential
      tags:
      - Minting API Unstable
