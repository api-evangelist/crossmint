components:
  schemas:
    IPAssetGraphDto__schema1:
      properties:
        children:
          description: Array of child IP asset nodes, empty if no children are available
          examples:
          - children: []
            ipId: '0xabcdef0123456789abcdef0123456789abcdef01'
          items:
            $ref: '#/components/schemas/IPAssetGraphDto__schema1'
          type: array
        ipId:
          description: The IP ID of the child asset
          examples:
          - '0x123456789abcdef0123456789abcdef012345678'
          type: string
      required:
      - children
      - ipId
      type: object
    StoryActionsResponseDto:
      properties:
        id:
          type: string
        status: {}
      required:
      - id
      - status
      type: object
    CollectionCreationInputDto:
      properties:
        chain:
          description: The chain of the collection, either `story` or `story-testnet`
          examples:
          - story-testnet
          type: string
        metadata:
          additionalProperties: false
          description: Story Protocol collection metadata
          examples:
          - description: My Collection Description
            image: https://example.com/image.png
            name: My Collection
            symbol: MYCOL
          properties:
            banner_image:
              description: A URI pointing to a resource with mime type image/* that represents the contract, displayed as a banner image
              examples:
              - https://example.com/banner.png
              format: uri
              type: string
            description:
              description: The description of the contract
              examples:
              - My Collection Description
              type: string
            external_link:
              description: The external link of the contract
              examples:
              - https://example.com
              format: uri
              type: string
            featured_image:
              description: A URI pointing to a resource with mime type image/* that represents the featured image for the contract
              examples:
              - https://example.com/featured.png
              format: uri
              type: string
            image:
              description: A URI pointing to a resource with mime type image/* that represents the contract, typically displayed as a profile picture
              examples:
              - https://example.com/image.png
              format: uri
              type: string
            name:
              description: The name of the collection
              examples:
              - My Collection
              type: string
            symbol:
              description: The symbol of the collection
              examples:
              - MYCOL
              type: string
          required:
          - description
          - name
          - symbol
          type: object
        reuploadLinkedFiles:
          default: true
          description: Controls whether external files (like images) in the metadata should be reuploaded to decentralized storage (IPFS) (true) or referenced with their original URLs (false). Default is True.
          examples:
          - true
          type: boolean
        supplyLimit:
          description: The supply limit of the collection
          examples:
          - 100
          type: number
      required:
      - chain
      - metadata
      type: object
    MultiplePILTermsResponseDto:
      description: 'Specific terms for a Story Protocol PIL (Programmable IP License). Default is the `Non-Commercial Social Remixing` license. More details here: https://docs.story.foundation/docs/pil-terms'
      examples:
      - disabled: false
        id: '155'
        terms:
          commercialAttribution: true
          commercialRevCeiling: 0
          commercialRevShare: 10000000
          commercialUse: true
          commercializerChecker: '0x0000000000000000000000000000000000000000'
          commercializerCheckerData: '0x0000000000000000000000000000000000000000'
          currency: '0x1234567890123456789012345678901234567890'
          defaultMintingFee: 100
          derivativeRevCeiling: 0
          derivativesAllowed: true
          derivativesApproval: false
          derivativesAttribution: true
          derivativesReciprocal: true
          expiration: 0
