tags:
- name: V1 Alpha1
paths:
  /v1-alpha1/wallets/{locator}/nfts:
    get:
      description: 'Retrieves NFTs from a wallet.


        **API scope required**: `wallets:nfts.read`'
      operationId: wallets.v1Alpha1.nfts.list
      parameters:
      - description: Page number, starting at 1.
        in: query
        name: page
        required: false
        schema:
          allOf:
          - pattern: ^[1-9]\d*$
          - pattern: ^\d+$
          type: string
      - description: Number of items per page.
        in: query
        name: perPage
        required: false
        schema:
          allOf:
          - pattern: ^[1-9]\d*$
          - pattern: ^\d+$
          type: string
      - description: Filter NFTs by contract address. Can be a single address or an array of addresses.
        in: query
        name: contractAddress
        required: false
        schema:
          items:
            type: string
          type: array
      - description: Filter NFTs by token ID
        in: query
        name: tokenId
        required: false
        schema:
          examples:
          - '123'
          type: string
      - in: path
        name: locator
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletNFTsResponseDto'
          description: Returns an array of NFTs in the wallet
      security:
      - apiKey: []
      summary: Get NFTs from Wallet
      tags:
      - V1 Alpha1
  /v1-alpha1/wallets/{walletLocator}/credential_nfts:
    get:
      description: 'Returns the NFTs in a wallet that carry verifiable credentials, one page at a time. Each item is the NFT with its `locator` and metadata; Get Credential by NFT Locator returns the credential itself.


        **API scope required**: `credentials.read`


        **Related**: Retrieve credentials'
      operationId: wallets.credentials.list
      parameters:
      - description: Page number, starting at 1.
        in: query
        name: page
        required: false
        schema:
          allOf:
          - pattern: ^[1-9]\d*$
          - pattern: ^\d+$
          type: string
      - description: Number of items per page.
        in: query
        name: perPage
        required: false
        schema:
          allOf:
          - pattern: ^[1-9]\d*$
          - pattern: ^\d+$
          type: string
      - description: The wallet's locator, `<chain>:<walletAddress>`.
        in: path
        name: walletLocator
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The wallet's credential NFTs for the requested page.
      security:
      - apiKey: []
      summary: Get Credential NFTs
      tags:
      - V1 Alpha1
components:
