            type: boolean
          locator:
            description: The unique locator for the token
            examples:
            - ethereum:0x1234567890123456789012345678901234567890:123
            type: string
          metadata:
            description: NFT metadata including name, description, image, and attributes
            properties:
              animation_url:
                type: string
              attributes:
                items:
                  properties:
                    trait_type:
                      type: string
                    value:
                      anyOf:
                      - type: boolean
                      - type: number
                      - type: string
                  required:
                  - trait_type
                  - value
                  type: object
                type: array
              description:
                type: string
              external_url:
                type: string
              image:
                type: string
              name:
                type: string
            type: object
          subscription:
            description: Subscription information if the token has subscription properties
            properties:
              expiresAt:
