    CreatePaymentMethodVaultResponseDto:
      description: A saved payment method. Sensitive fields (full PAN, CVC, full account numbers, IBANs, Bre-B keys) are never included.
      examples:
      - card:
          billing:
            name: John Doe
          brand: visa
          country: US
          expiration:
            month: '12'
            year: '2028'
          fundingType: credit
          last4: '4242'
        createdAt: 2025-01-15 10:30:00+00:00
        default: true
        display:
          imageUrl: https://www.crossmint.com/assets/cards/visa.svg
          label: Visa ending in 4242
        displayName: Visa ••4242
        paymentMethodId: 3f7a9c10-2a8b-4c5d-9e2f-1b3a4c5d6e7f
        type: card
        updatedAt: 2025-01-15 10:30:00+00:00
      oneOf:
      - properties:
          bankAccount:
            additionalProperties: false
            description: Bank account details. Present when `type` is a bank type. Full account numbers and IBANs are never included.
            properties:
              accountHolder:
                description: Person or company that owns the account.
                properties:
                  document:
                    description: Identity document of the account holder. The full number is never returned.
                    properties:
                      suffix:
                        description: Last four characters of the document number.
                        type: string
                      type:
                        description: 'Document type: `cc` (Cédula de Ciudadanía), `nit` (NIT), `ce` (Cédula de Extranjería), `pa` (passport), `ppt` (Permiso por Protección Temporal), `ti` (Tarjeta de Identidad), `rc` (Registro Civil), `te` (Tarjeta de Extranjería) or `die` (foreign identity document).'
                        enum:
                        - cc
                        - ce
                        - die
                        - nit
                        - pa
                        - ppt
                        - rc
                        - te
                        - ti
                        type: string
                    required:
                    - suffix
                    - type
                    type: object
                  email:
                    description: Email address of the account holder.
                    format: email
                    pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                    type: string
                  name:
                    description: Full legal name of the account holder. Sent to the payout provider.
                    minLength: 1
                    type: string
                  phoneNumber:
                    description: Phone number of the account holder in E.164 format.
                    minLength: 1
                    type: string
                required:
                - document
                - name
                type: object
              accountSuffix:
                description: The last characters of the account number, CLABE or IBAN, at most four.
                type: string
              accountType:
                description: Type of the account.
                enum:
                - checking
                - electronic-deposit
                - savings
                type: string
              country:
                const: CO
                description: Always `CO`.
                type: string
              currency:
                const: cop
                description: Always 'cop'; a Colombian bank account only settles in Colombian pesos.
                type: string
              entityType:
                description: Type of the account holder. Present when sent on creation.
                enum:
                - business
                - individual
                type: string
              institutionId:
                description: ID of the bank, for example `co-bancolombia`. The [Bank Institution IDs](https://docs.crossmint.com/offramp/guides/bank-institution-ids) page lists every ID.
                type: string
              rails:
                description: Bank rails available for payouts to this account. `supported` lists rails a currently-available provider advertises for this bank account; Crossmint decides payer eligibility at order time, so an order can still be refused on a rail listed here. `pending` lists rails still being resolved (non-empty only while `status` is 'pending'); `status` is 'pending' while asynchronous rail resolution is still running. Absent when no payout provider serves the account, or when `status` is 'rejected'.
                properties:
                  pending:
                    description: Rails still being resolved. Non-empty only while `status` is `pending`.
                    items:
                      enum:
                      - ach-credit
                      - bi-fast
                      - bre-b
                      - citad
                      - fednow
                      - fedwire
                      - instapay
                      - napas-247
                      - nip
                      - pesonet
                      - promptpay
                      - rtp-credit
                      - same-day-ach-credit
                      - sct
                      - sct-inst
                      - spei
                      type: string
                    type: array
                  status:
                    description: '`pending` while asynchronous rail resolution is still running. `complete` when every provider has answered.'
                    enum:
                    - complete
                    - pending
                    type: string
                  supported:
                    description: Rails that a currently-available payout provider advertises for this account.
                    items:
                      enum:
                      - ach-credit
                      - bi-fast
                      - bre-b
                      - citad
                      - fednow
                      - fedwire
                      - instapay
                      - napas-247
                      - nip
                      - pesonet
                      - promptpay
                      - rtp-credit
                      - same-day-ach-credit
                      - sct
                      - sct-inst
                      - spei
                      type: string
                    type: array
                required:
                - pending
                - status
                - supported
                type: object
              verificationStatus:
                description: Result of the provider's check on the destination. Absent until a provider answers.
                enum:
                - pending-review
                - rejected
                - verified
                type: string
            required:
            - accountHolder
            - accountSuffix
            - accountType
            - country
            - currency
            - institutionId
            type: object
          createdAt:
            description: ISO 8601 timestamp when this payment method was created.
            example: 2024-01-15 10:30:00+00:00
            format: date-time
            type: string
          label:
            description: The client's own name for this payment method, when one was sent.
            minLength: 1
            type: string
          lastPayoutAt:
            description: Read-only. ISO 8601 timestamp of the most recent successful offramp payout funded by this bank account. Absent if none.
            example: 2024-01-15 10:30:00+00:00
            format: date-time
            type: string
          paymentMethodId:
            description: Unique identifier (UUID v4). Crossmint assigns it on creation.
            minLength: 1
            type: string
          reason:
            anyOf:
            - description: Deprecated. Use `statusReason`, which carries the same value.
              type: string
            - type: 'null'
          status:
            description: Whether a payout provider serves this destination. 'pending' while the readiness checks run, 'active' when a provider advertises a rail for it, 'rejected' when it cannot receive funds, 'deleted' when it was deleted. This describes the destination only, never the payer's eligibility. 'pending' moves to 'active', 'rejected' or 'deleted'; 'active' moves to 'rejected' or 'deleted'; 'rejected' moves only to 'deleted'. Branch on this field, never on `statusReason`.
            enum:
            - active
            - deleted
            - pending
            - rejected
            type: string
          statusReason:
            anyOf:
            - description: 'Why the status is ''rejected''. Null on every other status, and on a rejection with no established destination condition. Known values today: destination-not-found, destination-closed, destination-cannot-receive, no-rail-available. New codes can appear at any time, so branch on `status` and treat an unrecognised code as the status alone.'
              type: string
            - type: 'null'
          type:
            const: bank-account-co
            description: 'Payment method type. Selects which sub-object is present: `card`, `bankAccount`, or `breB`.'
            type: string
          updatedAt:
            description: ISO 8601 timestamp when this payment method was last modified.
            example: 2024-01-15 10:30:00+00:00
            format: date-time
            type: string
        required:
        - bankAccount
        - createdAt
        - paymentMethodId
        - reason
        - status
        - statusReason
        - type
        - updatedAt
