paths:
  /unstable/order-intents:
    get:
      description: 'List all order intents for the authenticated user.


        **API scope required**: `order-intents.read`'
      operationId: orderIntents.list
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OrderIntentResponseDto'
                type: array
          description: Returns the list of order intents
      security:
      - apiKey: []
        userJwt: []
      summary: List Order Intents
      tags:
      - Order Intents
    post:
      description: 'Create a new order intent.


        **API scope required**: `order-intents.create`'
      operationId: orderIntents.create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderIntentInputDto'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderIntentResponseDto'
          description: The order intent has been successfully created
      security:
      - apiKey: []
        userJwt: []
      summary: Create Order Intent
      tags:
      - Order Intents
  /unstable/order-intents/{orderIntentId}:
    delete:
      description: 'Cancel an active order intent.


        **API scope required**: `order-intents.revoke`'
      operationId: orderIntents.cancel
      parameters:
      - in: path
        name: orderIntentId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: The order intent has been successfully cancelled
      security:
      - apiKey: []
        userJwt: []
      summary: Cancel Order Intent
      tags:
      - Order Intents
    get:
      description: 'Get a specific order intent by ID.


        **API scope required**: `order-intents.read`'
      operationId: orderIntents.get
      parameters:
      - in: path
        name: orderIntentId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderIntentResponseDto'
          description: Returns the order intent
      security:
      - apiKey: []
        userJwt: []
      summary: Get Order Intent
      tags:
      - Order Intents
  /unstable/order-intents/{orderIntentId}/credentials:
    post:
      description: 'Create a payment credential from an order intent.


        **API scope required**: `order-intents.credentials`'
      operationId: orderIntents.credentials.create
      parameters:
      - in: path
        name: orderIntentId
        required: true
        schema:
          type: string
      - description: 'Makes a retry of this request safe: a second call with the same key never consumes the amount again. Credential payloads are returned once, so a replay after a successful mint answers 409 `ORDER_INTENT_CREDENTIAL_ALREADY_ISSUED`. Without it every call is a new mint. 1 to 255 characters.'
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderIntentCredentialInputDto'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderIntentCredentialResponseDto'
          description: Returns the payment credential
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
          description: 'The card security code must be collected again before an `encrypted-card` credential can be issued (`code: "ORDER_INTENT_CVC_RECOLLECTION_REQUIRED"`). The rail stays `pending_cvc_recollection`: recollect the CVC and retry.


            A credential was already issued for this `Idempotency-Key` (`code: "ORDER_INTENT_CREDENTIAL_ALREADY_ISSUED"`). Credential payloads are returned once; use a new key for a new mint.'
      security:
      - apiKey: []
        userJwt: []
      summary: Create Order Intent Credential
      tags:
      - Order Intents
