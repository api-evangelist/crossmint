        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCheckoutListResponseDTO'
          description: Paginated list of checkout runs. `nextCursor` and `previousCursor` are present when more pages exist in that direction.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorDto'
