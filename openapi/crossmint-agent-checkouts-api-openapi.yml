      description: 'Requests cancellation of a checkout run. The response is an acknowledgement; the run reaches `cancelled` once the agent stops, which Get Agent Checkout reflects. Returns `409` when the run can no longer be cancelled.


        **API scope required**: `agent-checkouts.cancel`'
