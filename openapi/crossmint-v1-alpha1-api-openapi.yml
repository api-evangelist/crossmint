        locator: ethereum:0x1234567890123456789012345678901234567890:123
        metadata:
          attributes:
          - trait_type: Rarity
            value: Legendary
          - trait_type: Level
            value: 10
          description: An example NFT
          image: https://example.com/image.png
          name: Example NFT
