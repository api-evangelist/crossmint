- description: Staging environment (testnets)
  url: https://staging.crossmint.com/api
- description: Production environment (mainnets)
  url: https://www.crossmint.com/api
tags:
- name: Users - Linked Wallets
paths:
  /2025-06-09/users/{userLocator}/linked-wallets/{address}:
    delete:
      description: 'Unlink an external wallet address from a user.


        **API scope required**: `users.create`'
      operationId: users.linkedWallets.unlink
      parameters:
      - description: 'A user locator can be of the format:

          - `email:<email>`

          - `userId:<userId>`

          - `phoneNumber:<phoneNumber>`

          - `twitter:<handle>`

          - `x:<handle>`'
        in: path
        name: userLocator
        required: true
        schema:
          examples:
          - email:user@example.com
          - userId:507f1f77bcf86cd799439011
          - userId:did:example:cm4lr5piw0h6t1bjho0onryql
          - phoneNumber:+12125551234
          - twitter:johndoe
          - x:@johndoe
          type: string
      - in: path
        name: address
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Wallet unlinked from user. No content returned.
        '404':
          description: External wallet not found for this user
      security:
      - apiKey: []
      summary: Unlink External Wallet from User
      tags:
      - Users - Linked Wallets
    get:
      description: 'Get a linked external wallet for a user by address.


        **API scope required**: `users.read`'
      operationId: users.linkedWallets.get
      parameters:
      - description: 'A user locator can be of the format:

          - `email:<email>`

          - `userId:<userId>`

          - `phoneNumber:<phoneNumber>`

          - `twitter:<handle>`

          - `x:<handle>`'
        in: path
        name: userLocator
        required: true
        schema:
          examples:
          - email:user@example.com
          - userId:507f1f77bcf86cd799439011
          - userId:did:example:cm4lr5piw0h6t1bjho0onryql
          - phoneNumber:+12125551234
          - twitter:johndoe
          - x:@johndoe
          type: string
      - in: path
        name: address
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedWalletResponseDto'
          description: Linked wallet found
        '404':
          description: External wallet not found for this user
      security:
      - apiKey: []
      summary: Get Linked External Wallet
      tags:
      - Users - Linked Wallets
    put:
      description: 'Link an external wallet address to a user. Optionally provide a proof to verify ownership.


        **API scope required**: `users.create`'
      operationId: users.linkedWallets.link
      parameters:
      - description: 'A user locator can be of the format:

          - `email:<email>`

          - `userId:<userId>`

          - `phoneNumber:<phoneNumber>`

          - `twitter:<handle>`

          - `x:<handle>`'
        in: path
        name: userLocator
        required: true
        schema:
          examples:
          - email:user@example.com
          - userId:507f1f77bcf86cd799439011
          - userId:did:example:cm4lr5piw0h6t1bjho0onryql
          - phoneNumber:+12125551234
          - twitter:johndoe
          - x:@johndoe
          type: string
      - in: path
        name: address
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkWalletBodyDto'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedWalletResponseDto'
          description: Wallet linked to user
      security:
      - apiKey: []
      summary: Link External Wallet to User
      tags:
      - Users - Linked Wallets
