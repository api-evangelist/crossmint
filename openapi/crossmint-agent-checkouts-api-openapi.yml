      - apiKey: []
        userJwt: []
      - apiKey: []
      summary: Cancel Agent Checkout
      tags:
      - Agent Checkouts
  /unstable/agent-checkouts/{id}/messages:
    get:
      description: 'Returns the run''s conversation, one page at a time: the agent''s progress reports (`assistant`) and the user''s answers (`user`). Each message carries the run `revision` it was recorded at. For a live view, use Stream Agent Checkout Messages.


