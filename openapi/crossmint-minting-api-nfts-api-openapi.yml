openapi: 3.2.0
info:
  contact:
    email: support@crossmint.com
    name: Crossmint Support
    url: https://www.crossmint.com
  description: Generated from Crossmint's published product API specifications. Do not edit by hand.
  title: Crossmint Minting API NFTs API
  version: 1.0.0
servers:
- description: Staging environment (testnets)
  url: https://staging.crossmint.com/api
- description: Production environment (mainnets)
  url: https://www.crossmint.com/api
tags:
- name: Minting API NFTs
paths:
  /2022-06-09/collections/{collectionId}/nfts:
    get:
      description: Get all NFTs in a collection (paginated) or get a specific NFT by token locator
      operationId: nfts.list
      parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          type: string
      - in: query
        name: tokenLocator
        required: true
        schema:
          type: string
      - in: query
        name: page
        required: true
        schema:
          type: number
      - in: query
        name: perPage
        required: true
        schema:
          type: number
      responses:
        '200':
          description: NFTs retrieved successfully
      security:
      - apiKey: []
      summary: Get NFTs in a collection or by token locator
      tags:
      - Minting API NFTs
    post:
      description: Create a new NFT
      operationId: nfts.create
      parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NFTCreationDTO'
        required: true
      responses:
        '200':
          description: NFT creation started successfully
      security:
      - apiKey: []
      summary: Create NFT
      tags:
      - Minting API NFTs
  /2022-06-09/collections/{collectionId}/nfts/{customerFacingId}:
    delete:
      description: Burn an existing NFT
      operationId: nfts.burn
      parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          type: string
      - in: path
        name: customerFacingId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: NFT burn started successfully
      security:
      - apiKey: []
      summary: Burn NFT
      tags:
      - Minting API NFTs
    get:
      description: Get a single NFT
      operationId: nfts.get
      parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          type: string
      - in: path
        name: customerFacingId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: NFT retrieved successfully
      security:
      - apiKey: []
      summary: Get NFT
      tags:
      - Minting API NFTs
    patch:
      description: Update an existing NFT
      operationId: nfts.update
      parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          type: string
      - in: path
        name: customerFacingId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NFTUpdateDTO'
        required: true
      responses:
        '200':
          description: NFT updated successfully
      security:
      - apiKey: []
      summary: Update NFT
      tags:
      - Minting API NFTs
    put:
      description: Create a new NFT with a pre-computed id, or get an existing one if the id already exists
      operationId: nfts.createWithId
      parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          type: string
      - in: path
        name: customerFacingId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NFTCreationDTO'
        required: true
      responses:
        '200':
          description: NFT creation started successfully
      security:
      - apiKey: []
      summary: Create NFT (Idempotent)
      tags:
      - Minting API NFTs
  /2022-06-09/collections/{collectionId}/nfts/{customerFacingId}/send:
    post:
      description: Transfer an existing NFT
      operationId: nfts.transfer
      parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          type: string
      - in: path
        name: customerFacingId
        required: true
        schema:
          type: string
      requestBody:
