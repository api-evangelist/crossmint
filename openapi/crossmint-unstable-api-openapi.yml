components:
  schemas:
    SendTokenDTO:
      properties:
        amount:
          description: Amount of tokens to transfer (in decimal format)
          examples:
          - '42.69'
          pattern: ^\d+(?:\.\d*)?$
          type: string
        recipient:
          description: 'An address locator that supports different types of recipients. It can be of the format:

            - `<address>` (wallet address)

            - `chain:address` (e.g. ethereum:0x1234...)

            - `address:<blockchain_address>[:chain]`

            - `email:<email_address>[:chain]`

            - `phoneNumber:<phone_number>[:chain]`

            - `twitter:<twitter_handle>[:chain]`

            - `x:<twitter_handle>[:chain]`

            - `userId:<user_id>[:chain]`'
          type: string
        signer:
          description: Optional signer locator. Defaults to admin signer
          examples:
          - evm-keypair:0xdeadbeef
          title: Signer Locator
          type: string
        transactionType:
          anyOf:
          - const: direct
            description: The transaction is executed directly from the wallet. Use this for standard blockchain operations that do not require additional regulatory oversight.
            title: Direct transaction
            type: string
          - const: onramp
            description: The transaction is routed through Crossmint's regulated infrastructure. This enables compliance with regulatory requirements and performs enhanced validation checks.
            title: Onramp transaction
            type: string
          - const: regulated-transfer
            description: The transaction is routed through Crossmint's regulated infrastructure. This enables compliance with regulatory requirements and performs enhanced validation checks.
            title: Regulated transfer transaction
            type: string
          default: direct
          description: Specifies the type of transaction. Choose 'direct' for standard interactions or 'regulated-transfer' for operations requiring compliance checks.
      required:
      - recipient
      type: object
    WalletsV1Alpha2TransactionResponseDTOClass:
      description: Complete transaction response including status, signing requirements, and wallet type specific data
      oneOf:
      - properties:
          approvals:
            description: Complete approval data including requirements, pending and submitted signatures
            properties:
              pending:
                description: List of pending signatures
                items:
                  properties:
                    message:
                      description: The message that needs to be signed
                      type: string
                    quorumApprovals:
                      description: Per-member progress of an m-of-n quorum signer
                      properties:
                        pending:
                          description: Quorum members that have not yet submitted
                          items:
                            properties:
                              message:
                                description: The message that this member needs to sign
                                type: string
                              signer:
                                description: The locator of the quorum member that's pending approval
                                type: string
                            required:
                            - message
                            - signer
                            type: object
                          type: array
                        remaining:
                          description: Number of member approvals still outstanding to reach the threshold
                          type: number
                        submitted:
                          description: Quorum members that have already submitted
                          items:
                            properties:
                              message:
                                description: The message that this member signed
                                type: string
                              signature:
                                description: The cryptographic signature
                                type: string
                              signer:
                                description: The locator of the quorum member who submitted this signature
                                type: string
                              submittedAt:
                                description: When the member signature was submitted
                                type: number
                            required:
                            - message
                            - signature
                            - signer
                            - submittedAt
                            type: object
                          type: array
                        threshold:
                          description: Number of member approvals required to satisfy the quorum
                          type: number
                      required:
                      - pending
                      - remaining
                      - submitted
                      - threshold
                      type: object
                    signer:
                      description: The locator of the signer that's pending approval
                      type: string
                  required:
                  - message
                  - signer
                  type: object
                type: array
              required:
                description: Number of required approvals for the transaction
                type: number
              submitted:
                description: Record of all submitted signatures
                items:
                  properties:
                    message:
                      description: The message that was signed
                      type: string
                    metadata:
                      description: Additional metadata about the signature submission
                      properties:
                        deviceInfo:
                          type: string
                        ipAddress:
                          type: string
                        userAgent:
                          type: string
                      type: object
                    quorumApprovals:
                      description: Per-member progress of an m-of-n quorum signer
                      properties:
                        pending:
                          description: Quorum members that have not yet submitted
                          items:
                            properties:
                              message:
                                description: The message that this member needs to sign
                                type: string
                              signer:
                                description: The locator of the quorum member that's pending approval
                                type: string
                            required:
                            - message
                            - signer
                            type: object
                          type: array
                        remaining:
                          description: Number of member approvals still outstanding to reach the threshold
                          type: number
                        submitted:
                          description: Quorum members that have already submitted
                          items:
                            properties:
                              message:
                                description: The message that this member signed
                                type: string
                              signature:
                                description: The cryptographic signature
                                type: string
                              signer:
                                description: The locator of the quorum member who submitted this signature
                                type: string
                              submittedAt:
                                description: When the member signature was submitted
                                type: number
                            required:
                            - message
                            - signature
                            - signer
                            - submittedAt
                            type: object
                          type: array
                        threshold:
                          description: Number of member approvals required to satisfy the quorum
                          type: number
                      required:
                      - pending
                      - remaining
                      - submitted
                      - threshold
                      type: object
                    signature:
                      description: The cryptographic signature
                      type: string
                    signer:
                      description: The locator of the signer who submitted this signature
                      examples:
                      - evm-keypair:0x1234567890123456789012345678901234567890
                      - evm-passkey:credential-id-123
                      - evm-fireblocks-custodial:0x1234567890123456789012345678901234567890
                      - solana-keypair:DUSTawucrTsGU8hcqRdHDCbuYhCPADMLM2VcCb8VnFnQ
                      - solana-fireblocks-custodial:DUSTawucrTsGU8hcqRdHDCbuYhCPADMLM2VcCb8VnFnQ
                      - api-key:G...
                      - email:user@example.com
                      - phone:+1234567890
                      - device:BIVmCqMz8QJB+se2kJEpGQ...
                      - passkey:cWtP7gmZbd98HbKUuGXx5Q
                      title: Signer Locator
                      type: string
                    submittedAt:
                      description: When the signature was submitted
                      type: number
                  required:
                  - message
                  - signature
                  - signer
                  - submittedAt
                  type: object
                type: array
            required:
            - pending
            - submitted
            type: object
          completedAt:
            description: ISO timestamp when the transaction reached finality
            type: number
          createdAt:
            description: ISO timestamp when the transaction was created
            type: number
          error:
            $ref: '#/components/schemas/WalletsV1Alpha2TransactionError'
            description: Error message if the transaction fails after submission
          id:
            description: Unique identifier for the transaction
            type: string
          onChain:
            description: EVM MPC wallet transaction data including input parameters and chain specific details
            properties:
              call:
                properties:
                  data:
                    description: The encoded calldata for this transaction
                  to:
                    description: The recipient address for this transaction call
                    type: string
                required:
                - data
                - to
                type: object
              explorerLink:
                type: string
              txId:
                description: A hex string
                type: string
            required:
            - call
            title: EVM MPC wallet transaction data
            type: object
          params:
            description: EVM MPC wallet transaction parameters
            properties:
              call:
                anyOf:
                - additionalProperties: false
                  properties:
                    abi:
                      description: The ABI for the function to call
                      items: {}
                      type: array
                    address:
                      description: The recipient address for this transaction call
                      type: string
                    args:
                      description: The arguments to pass to the function
                      items: {}
                      type: array
                    functionName:
                      description: The name of the function to call
                      type: string
                  required:
                  - abi
                  - address
                  - args
                  - functionName
                  type: object
                - additionalProperties: false
                  properties:
                    data:
                      description: The encoded calldata for this transaction
                    to:
                      description: The recipient address for this transaction call
                      type: string
                  required:
                  - data
                  - to
                  type: object
                description: The transaction call to execute
              chain:
                description: The chain on which the transaction will be executed
                enum:
                - abstract
                - abstract-testnet
                - apechain
                - arbitrum
                - arbitrum-sepolia
                - arbitrumnova
                - arc
                - arc-testnet
                - astar-zkevm
                - avalanche
                - avalanche-fuji
                - base
                - base-goerli
                - base-sepolia
                - bsc
                - bsc-testnet
                - celo
                - celo-sepolia
                - chiliz
                - chiliz-spicy-testnet
                - coti
                - coti-testnet
                - curtis
                - ethereum
                - ethereum-goerli
                - ethereum-sepolia
                - flow
                - flow-testnet
                - hedera
                - hedera-testnet
                - hypersonic-testnet
                - lightlink
                - lightlink-pegasus
                - mantle
                - mantle-sepolia
                - mode
                - mode-sepolia
                - optimism
                - optimism-goerli
                - optimism-sepolia
                - plume
                - plume-testnet
                - polygon
                - polygon-amoy
